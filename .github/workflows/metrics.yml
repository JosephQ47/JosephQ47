name: Generate Matrix Calendar

on:
  schedule:
    # 每天北京时间 08:00 刷新
    - cron: "0 0 * * *"
  workflow_dispatch:

# 生成 3D 等距提交日历 SVG。
#
# 重要：lowlighter/metrics 自己会通过 GitHub API 把产物提交进仓库
#      （committer_token 默认用内置 GITHUB_TOKEN）。
#      所以这里故意没有 actions/checkout，也不要再加手动的
#      git add / commit / push 步骤 —— workspace 不是 git 仓库，
#      git 会直接 fatal 并返回 exit code 128。
#
# 前置：仓库 Secrets 里需要 METRICS_TOKEN（classic PAT）
#      scope：read:user；仓库全是 private 时还得加 repo，不然统计是空的。
#
# 隐私：只用 isocalendar 插件，只输出“哪天有多少提交”的格子，
#      不含 repositories 插件，私有仓库名不会出现在 SVG 里。

jobs:
  calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: main
          committer_message: "chore: refresh matrix calendar [skip ci]"
          filename: assets/metrics-calendar.svg
          base: ""
          config_timezone: Asia/Shanghai
          verify: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # ────────────────────────────────────────────────────
          # 四个实测踩过的坑，改这段前先读：
          #
          # 1. 不要写 --color-calendar-graph-day-* 这类 CSS 变量。
          #    isocalendar 把颜色写死在每个 path 元素的 fill 属性上，
          #    实测 var() 在输出里出现 0 次，变量根本没人读。
          #    只能用下面那种属性选择器覆盖。
          #
          # 2. h2 必须把 box 撑开。它带 class="field"，规则是 display:flex
          #    加 line-height:normal，实测 box 只有 21px 而字号 16px。
          #    把 SVG 当文档直接打开看不出问题，但用 img 引入时
          #    超出 box 的部分会被边界裁掉，标题就缺下半截。
          #    padding-bottom 或 line-height 都能解决，这里用前者。
          #
          # 3. 不要用 display:none 隐藏 h2。那会让 metrics 测高时当它
          #    不存在，但输出的 SVG 里元素仍在。要隐藏得用
          #    visibility:hidden（仍占位），不过那样顶部会空一块。
          #
          # 4. 注释里不能出现尖括号。extras_css 会被内嵌进 SVG，
          #    而 SVG 按 XML 解析，CSS 注释对 XML 不是注释 ——
          #    一个 "less-than" 就会被当成标签开头，整个 SVG 直接报废。
          # ────────────────────────────────────────────────────
          extras_css: |
            /* 空格子：用暗绿而不是背景色 #0D0208。
               与背景同色会让柱子悬在虚空里，看不出是个日历。 */
            path[fill="#ebedf0"] { fill: #04170B; }
            /* 贡献量四级渐变，接到荧光绿 */
            path[fill="#9be9a8"] { fill: #006400; }
            path[fill="#40c463"] { fill: #00A82C; }
            path[fill="#30a14e"] { fill: #00D634; }
            path[fill="#216e39"] { fill: #00FF41; }
            svg { background: #0D0208; }
            /* padding-bottom 是必需的，不是装饰 —— 见上面第 2 条 */
            h2 { color: #00FF41; padding-bottom: 8px; }
            text, tspan { fill: #008F11; }
