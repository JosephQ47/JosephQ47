name: Generate Matrix Snake

on:
  schedule:
    # 每天北京时间 08:10 刷新（比 metrics 抄 10 分钟，避开并发提交）
    - cron: "10 0 * * *"
  workflow_dispatch:

# 把贡献热力图变成一条绿色的蛇，生成 SVG 提交到 assets/
# 无需额外 token，用内置 GITHUB_TOKEN 即可。
#
# 注意：刻意不在 push 时触发。贡献数据与本次 push 的内容无关，
#      而三个 workflow 同时往 main 提交会互相顶掉（首次部署就栩在这上面）。

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake (Matrix green)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/matrix-snake.svg?color_snake=%2300FF41&color_dots=%230D0208,%23003B00,%23006400,%2300C82C,%2300FF41

      - name: Move into assets and commit
        run: |
          set -euo pipefail
          mkdir -p assets
          mv dist/matrix-snake.svg assets/matrix-snake.svg
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/matrix-snake.svg
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: refresh matrix snake [skip ci]"
          # 可能有另一个 workflow 刚推过，先 rebase 再推，最多试 3 次
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, retrying"
            sleep $((i * 5))
          done
          echo "push failed after 3 attempts" >&2
          exit 1
